name: Keep Supabase Database Active

on:
  schedule:
    # Runs every 2 days at 04:00 UTC (10:00 AM BD time)
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Project REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "Pinging Supabase REST API to keep database active..."
            curl -s -f -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/products?select=id&limit=1" || true
            echo "Successfully pinged Supabase!"
          else
            echo "Supabase secrets not yet configured in GitHub Repo Secrets, skipping ping."
          fi
